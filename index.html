<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2475ed" />
    <title>校园失物招领</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/core.js"></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/backup.js"></script>
    <script defer src="js/seed.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/images.js"></script>
    <script defer src="js/views.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <main id="main-content" class="page-shell" tabindex="-1">
      <div id="app"><p class="loading">正在加载…</p></div>
      <noscript><p class="error-banner">请启用 JavaScript 后使用此网页。</p></noscript>
    </main>
    <nav class="main-nav" aria-label="主要导航">
      <a href="#/home" data-nav="home"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" /></svg
        ><span>首页</span></a
      >
      <a href="#/publish" data-nav="publish"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <path d="M12 7v10M7 12h10" /></svg
        ><span>发布信息</span></a
      >
      <a href="#/mine" data-nav="mine"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg
        ><span>我的发布</span></a
      >
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog
      id="confirm-dialog"
      class="modal"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
    >
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" class="button secondary" id="confirm-cancel">取消</button
        ><button type="button" class="button primary" id="confirm-ok">确认</button>
      </div>
    </dialog>
    <dialog id="copy-dialog" class="modal" aria-labelledby="copy-title">
      <h2 id="copy-title">手动复制联系方式</h2>
      <p>浏览器未允许自动复制。请选中下方内容，使用 Ctrl+C 或长按复制。</p>
      <label class="sr-only" for="manual-contact">手动复制文本</label
      ><input id="manual-contact" class="manual-contact" readonly />
      <button type="button" class="button primary full-width" id="copy-close">关闭</button>
    </dialog>
  </body>
</html>
